<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#A8D5E5" />
  <title>Jagoan Kali — Balap Kali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active" aria-label="Rumah Jagoan Kali">
      <header class="home-header">
        <p class="brand">Jagoan Kali</p>
        <div class="streak-badge" id="home-streak" title="Api Semangat">
          <span class="streak-icon" aria-hidden="true">🔥</span>
          <span class="streak-count" id="streak-count">0</span>
          <span class="streak-label">hari</span>
        </div>
      </header>

      <div class="home-hero">
        <div class="mascot" aria-hidden="true" id="home-mascot">🚀</div>
        <h1 class="home-title">Balap Kali</h1>
        <p class="home-sub">Hafalan &amp; kecepatan — balapan melawan waktu!</p>
      </div>

      <div class="home-meta">
        <div class="meta-pill">
          <span class="meta-label">Level</span>
          <span class="meta-value" id="home-level">1</span>
        </div>
        <div class="meta-pill">
          <span class="meta-label">Rekor</span>
          <span class="meta-value" id="home-best">0</span>
        </div>
        <div class="meta-pill">
          <span class="meta-label">Poin</span>
          <span class="meta-value" id="home-points">0</span>
        </div>
      </div>

      <div class="home-actions">
        <button type="button" class="btn btn-primary btn-lg" id="btn-start">Mulai Balapan</button>
        <button type="button" class="btn btn-ghost" id="btn-theme">Tema: <span id="theme-name">Luar Angkasa</span></button>
      </div>

      <p class="home-hint" id="level-hint">Tabel: 1, 2, 10 · 10 detik/soal</p>
    </section>

    <!-- COUNTDOWN -->
    <section id="screen-countdown" class="screen" aria-label="Bersiap" hidden>
      <div class="countdown-wrap">
        <p class="countdown-label">Bersiap…</p>
        <p class="countdown-num" id="countdown-num">3</p>
        <p class="countdown-level" id="countdown-level">Level 1</p>
      </div>
    </section>

    <!-- GAMEPLAY -->
    <section id="screen-play" class="screen" aria-label="Balap Kali" hidden>
      <header class="play-header">
        <button type="button" class="btn btn-icon" id="btn-quit" aria-label="Keluar">←</button>
        <div class="play-stats">
          <span class="stat" id="play-score" aria-label="Skor">0</span>
          <span class="stat combo" id="play-combo" hidden>x2</span>
        </div>
        <div class="play-progress-text">
          <span id="q-index">1</span>/<span id="q-total">10</span>
        </div>
      </header>

      <div class="race-track" aria-hidden="true">
        <div class="track-lane">
          <div class="vehicle" id="vehicle">🚀</div>
          <div class="finish" id="finish-flag">🏁</div>
        </div>
      </div>

      <div class="timer-bar-wrap" aria-label="Waktu tersisa">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <div class="question-card">
        <p class="question" id="question-text">2 × 3 = ?</p>
      </div>

      <div class="choices" id="choices" role="group" aria-label="Pilihan jawaban"></div>

      <div class="feedback" id="feedback" hidden>
        <p class="feedback-text" id="feedback-text"></p>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="screen" aria-label="Hasil ronde" hidden>
      <header class="results-header">
        <p class="brand-sm">Balap Kali</p>
        <h1 class="results-title" id="results-title">Hebat!</h1>
        <div class="stars" id="results-stars" aria-label="Bintang">
          <span class="star" data-n="1">★</span>
          <span class="star" data-n="2">★</span>
          <span class="star" data-n="3">★</span>
        </div>
      </header>

      <div class="results-score-block">
        <p class="results-score-label">Skor</p>
        <p class="results-score" id="results-score">0</p>
        <p class="results-detail" id="results-detail">8/10 benar · rata-rata 4.2 dtk</p>
      </div>

      <div class="insight-card" id="insight-card">
        <p class="insight-text" id="insight-text"></p>
      </div>

      <div class="level-up" id="level-up" hidden>
        <p class="level-up-text" id="level-up-text">Naik ke Level 2!</p>
      </div>

      <div class="results-actions">
        <button type="button" class="btn btn-primary btn-lg" id="btn-again">Main Lagi</button>
        <button type="button" class="btn btn-ghost" id="btn-home">Kembali ke Rumah</button>
      </div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/balap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
